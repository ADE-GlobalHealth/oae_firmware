[project]
name = "oae-firmware"
version = "0.1.0"
description = "Firmware and associated software for Global Health's low-cost OAE screening device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial (>=3.5,<4.0)", "numpy (>=2.2.5,<3.0.0)"]

[tool.setuptools]
packages = ["tools"]

[project.scripts]
oae_serial_host = "tools.oae_serial_host:main"
