name: C Lint Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**/*.c'

permissions:
  pull-requests: write 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup C linter tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Run clang-format
        run: clang-format -n **/*.c **/*.h || true

      - name: Post comments 
        uses: reviewdog/action-clang-format@latest
        with:
          format: diff
          reporter: github-pr-review
          filter_mode: diff
          fail_on_error: false

      - name: Run clang-tidy
        run: clang-tidy **/*.c -- -I. || true

      - name: Post comments 
        uses: reviewdog/action@latest
        with:
          tool_name: clang-tidy
          reporter: github-pr-review
          filter_mode: diff
          fail_on_error: false
