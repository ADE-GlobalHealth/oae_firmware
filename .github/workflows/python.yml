name: Python Lint Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**/*.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pylint
        run: |
          pip install pylint

      - name: Run pylint
        run: |
          pylint --output-format=parseable --exit-zero $(git ls-files '*.py') \
            | tee pylint-report.txt

      - name: Fail if pylint errors found
        run: |
          if grep -q "error" pylint-report.txt; then
            echo " Lint errors detected by pylint."
            exit 1
          fi
