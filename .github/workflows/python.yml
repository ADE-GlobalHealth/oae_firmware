name: Python Lint Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**/*.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pylint
        run: |
          pip install pylint

      - name: Run pylint
        run: |
          
          pylint --output-format=parseable $(git ls-files '*.py') > pylint-report.txt
          
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            line_no=$(echo "$line" | cut -d: -f2)
            col_no=$(echo "$line" | cut -d: -f3)
            type=$(echo "$line" | cut -d: -f4 | tr -d ' ')
            message=$(echo "$line" | cut -d: -f5-)

            if [ "$type" = "error" ]; then
              level="error"
            elif [ "$type" = "warning" ]; then
              level="warning"
            else
              level="notice"
            fi

            echo "::${level} file=${file},line=${line_no},col=${col_no}::${message}"
            done < pylint-report.txt

            if grep -q "^.*:.*:.*: error:.*$" pylint-report.txt; then
              exit 1
          fi
