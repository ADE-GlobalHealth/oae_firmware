name: Firmware Build For PRs (CliffBar)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'OAE_CliffBar/**/*.c'
  workflow_dispatch:

env:
  PROJECT_NAME: 'OAE_CliffBar'

jobs:
  build:
    name: "Building Firmware (Debug)"
    runs-on: ubuntu-latest
    container:
      image: xanderhendriks/stm32cubeide:16.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Project (direct Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v /tmp/stm32_workspace:/workspace \
            xandershendriks/stm32cubeide:16.0 \
            /opt/st/stm32cubeide_1.19.0/stm32cubeide \
              --launcher.suppressErrors -nosplash \
              -application org.eclipse.cdt.managedbuilder.core.headlessbuild \
              -data /workspace \
              -importAll /project/OAE_CliffBar \
              -build OAE_CliffBar


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.PROJECT_NAME }}.elf"
          path: "${{ env.PROJECT_NAME }}/Debug"
