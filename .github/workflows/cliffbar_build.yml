name: Firmware Build For PRs (CliffBar)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'OAE_CliffBar/**.c'
  workflow_dispatch:

jobs:
  build:
    name: Build CliffBar Firmware
    runs-on: ubuntu-latest
    container:
      image: xanderhendriks/stm32cubeide:16.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk
          java -version

      - name: Show environment info
        run: |
          gcc --version
          ls -la $GITHUB_WORKSPACE

      - name: Build firmware headlessly
        run: |
          mkdir -p /workspace
          /opt/st/stm32cubeide_1.19.0/ide/headlessbuild \
            -data /workspace \
            -import $GITHUB_WORKSPACE/OAE_CliffBar \
            -I $GITHUB_WORKSPACE/common/CMSIS-DSP/Include \
            -build OAE_CliffBar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cliffbar-firmware
          path: /workspace/OAE_CliffBar/Debug
