name: Firmware Build For PRs (CliffBar)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'OAE_CliffBar/**.c'
  workflow_dispatch:

jobs:
  build:
    name: Build CliffBar Firmware
    runs-on: ubuntu-latest
    container:
      image: xanderhendriks/stm32cubeide:16.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Show environment info
        run: |
          gcc --version
          ls -la $GITHUB_WORKSPACE

   
      - name: Build Project
        uses: xanderhendriks/action-build-stm32cubeide@v16.0
        with:
          project-path: '.'
          project-target: 'OAE_CliffBar/Debug'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OAE_CliffBar.elf
          path: OAE_CliffBar/Debug
